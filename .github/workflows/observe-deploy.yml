name: Observe VM GitOps deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: observe-deploy-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    name: VM ansible-pull
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
      ENVIRONMENT: vm-gitops
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Find or create GitHub deployment
        id: deploy
        run: |
          set -euo pipefail
          echo "## VM GitOps observe" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| expected SHA | \`${SHA}\` |" >> "$GITHUB_STEP_SUMMARY"

          existing_id="$(gh api "repos/${REPO}/deployments?sha=${SHA}&environment=${ENVIRONMENT}&per_page=10" --jq '.[0].id // empty')"
          if [ -n "$existing_id" ]; then
            state="$(gh api "repos/${REPO}/deployments/${existing_id}/statuses" --jq 'if any(.state=="success") then "success" else (.[0].state // "none") end')"
            echo "| existing deployment | ${existing_id} (${state}) |" >> "$GITHUB_STEP_SUMMARY"
            echo "id=${existing_id}" >> "$GITHUB_OUTPUT"
            echo "already=${state}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          payload="$(jq -n --arg ref "$SHA" --arg desc "Waiting for VM ansible-pull of ${SHA}" '{ref:$ref, environment:"vm-gitops", auto_merge:false, required_contexts:[], description:$desc}')"
          id="$(printf '%s' "$payload" | gh api "repos/${REPO}/deployments" --input - --jq .id)"
          status_payload="$(jq -n --arg desc "Waiting for VM ansible-pull (timer every 5 min)" --arg log "$RUN_URL" '{state:"in_progress", environment:"vm-gitops", description:$desc, log_url:$log, environment_url:"https://dev.bnpi-hris.tech/auth/login"}')"
          printf '%s' "$status_payload" | gh api "repos/${REPO}/deployments/${id}/statuses" --input -
          echo "| created deployment | ${id} (in_progress) |" >> "$GITHUB_STEP_SUMMARY"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "already=in_progress" >> "$GITHUB_OUTPUT"

      - name: Wait until VM reports deployed
        if: steps.deploy.outputs.already != 'success'
        run: |
          set -euo pipefail
          deploy_id="${{ steps.deploy.outputs.id }}"
          deadline=$((SECONDS + 600))
          state="${{ steps.deploy.outputs.already }}"
          while [ "$SECONDS" -lt "$deadline" ]; do
            ids="$(gh api "repos/${REPO}/deployments?sha=${SHA}&environment=${ENVIRONMENT}&per_page=10" --jq '.[].id')"
            if [ -z "$ids" ]; then
              ids="$deploy_id"
            fi
            state="none"
            saw_failure=""
            while read -r id; do
              [ -z "$id" ] && continue
              this="$(gh api "repos/${REPO}/deployments/${id}/statuses" --jq 'if any(.state=="success") then "success" elif any(.state=="failure") then "failure" elif any(.state=="error") then "error" else (.[0].state // "none") end')"
              echo "deployment=${id} state=${this} sha=${SHA}"
              if [ "$this" = "success" ]; then
                echo "| VM report | success (deployment ${id}) |" >> "$GITHUB_STEP_SUMMARY"
                echo "VM ansible-pull reported success for ${SHA} on deployment ${id}"
                exit 0
              fi
              state="$this"
              if [ "$this" = "failure" ] || [ "$this" = "error" ]; then
                saw_failure="$this"
              fi
            done <<EOF
${ids}
EOF
            if [ -n "$saw_failure" ]; then
              echo "| VM report | ${saw_failure} |" >> "$GITHUB_STEP_SUMMARY"
              echo "VM reported ${saw_failure} for ${SHA}" >&2
              exit 1
            fi
            sleep 20
          done
          echo "| VM report | timeout (still ${state}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "Timed out waiting 10 minutes for VM ansible-pull of ${SHA} (last state=${state})." >&2
          echo "Look at environment ${ENVIRONMENT} on the repo Deployments page." >&2
          exit 1

      - name: Record already-deployed
        if: steps.deploy.outputs.already == 'success'
        run: |
          echo "| VM report | already success |" >> "$GITHUB_STEP_SUMMARY"
          echo "VM already reported ansible-pull success for ${SHA}"
