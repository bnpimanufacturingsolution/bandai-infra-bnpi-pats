name: Validate Project Truth Hyper-V Repo

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - uat
      - production
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - uses: hashicorp/setup-packer@v3
        with:
          version: 1.14.2

      - name: Validate Node app syntax
        shell: powershell
        run: node -c app/server.js

      - name: Validate PowerShell scripts parse
        shell: powershell
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $($file.FullName)"
            }
          }

      - name: Terraform fmt
        shell: powershell
        run: terraform -chdir=terraform-hyperv fmt -check -recursive

      - name: Terraform init and validate
        shell: powershell
        run: |
          terraform -chdir=terraform-hyperv init
          terraform -chdir=terraform-hyperv validate

      - name: Render GitOps overlays
        shell: powershell
        run: |
          kubectl kustomize gitops/overlays/dev
          kubectl kustomize gitops/overlays/uat
          kubectl kustomize gitops/overlays/prod

      - name: Prepare Packer staging inputs
        shell: powershell
        run: |
          $staging = 'image-factory/packer/staging'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $excludedDirectories = @(
            '.git',
            '.github',
            'node_modules',
            'dist',
            'build',
            '.next',
            '.react-router',
            'coverage',
            'test-results',
            'playwright-report',
            'output',
            '.runtime',
            'logs',
            '.cache',
            '.prisma'
          )
          $excludedFiles = @(
            '.env',
            '.env.*',
            '*.tmp',
            '*.log',
            'npm-debug.log*',
            'yarn-debug.log*',
            'yarn-error.log*',
            'pnpm-debug.log*'
          )
          foreach ($name in @('gitops', 'appliance', 'hris-api', 'hris-app')) {
            $destination = Join-Path $staging $name
            New-Item -ItemType Directory -Force -Path $destination | Out-Null
            & robocopy.exe $name $destination /MIR /NFL /NDL /NJH /NJS /NP /XD $excludedDirectories /XF $excludedFiles
            if ($LASTEXITCODE -gt 7) {
              throw "robocopy failed while staging $name to $destination with exit code $LASTEXITCODE"
            }
            $global:LASTEXITCODE = 0
          }

      - name: Validate maintainer-only Packer template
        shell: powershell
        run: |
          packer init image-factory/packer/ubuntu-hyperv.pkr.hcl
          packer validate image-factory/packer/ubuntu-hyperv.pkr.hcl
          packer init image-factory/packer/ubuntu-virtualbox.pkr.hcl
          packer validate image-factory/packer/ubuntu-virtualbox.pkr.hcl

      - name: Validate installer and shortcut contract
        shell: powershell
        run: |
          .\installer\build-installer.ps1
          $installDir = Join-Path $env:RUNNER_TEMP 'ProjectTruthInstallTest'
          .\installer\install-project-truth.ps1 -InstallDir $installDir
          .\installer\verify-install.ps1 -InstallDir $installDir
