name: Promote GitOps Release Tag

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to promote
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod
      image_tag:
        description: Release/image tag to record in the selected environment overlay
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update selected overlay
        shell: bash
        run: |
          set -euo pipefail
          env_name="${{ inputs.environment }}"
          tag="${{ inputs.image_tag }}"
          case "$env_name" in
            dev|uat|prod) ;;
            *) echo "Unsupported environment: $env_name" >&2; exit 1 ;;
          esac
          [[ "$tag" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid image tag" >&2; exit 1; }
          file="gitops/overlays/$env_name/environment-patch.yaml"
          test -f "$file" || { echo "Overlay patch not found: $file" >&2; exit 1; }
          if grep -qE '^  release_tag:' "$file"; then
            sed -i -E "s#^  release_tag: .*\$#  release_tag: \"$tag\"#" "$file"
          else
            awk -v tag="$tag" '
              { print }
              /^data:/ && !done { print "  release_tag: \"" tag "\""; done=1 }
            ' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          fi

      - name: Commit change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/overlays/${{ inputs.environment }}/environment-patch.yaml
          git diff --cached --quiet && exit 0
          git commit -m "gitops: promote ${{ inputs.environment }} ${{ inputs.image_tag }}"
          git push
