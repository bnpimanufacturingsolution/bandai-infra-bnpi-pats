name: CI

on:
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bnpi-pats-api:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: bnpi-pats-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bnpi-pats-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bnpi-pats-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Source-truth tests
        run: npm run test:regression:payroll-source-truth

  bnpi-pats-app:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: bnpi-pats-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bnpi-pats-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: bnpi-pats-app/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test:payroll-correction

  ansible:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: ansible
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check pull playbook
        run: |
          python -m pip install "ansible-core>=2.16,<2.19"
          ansible-playbook --syntax-check -i localhost, ansible/project-truth-pull.yml

  gitops:
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    name: gitops
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.4
      - name: Render GitOps overlays
        run: |
          set -euo pipefail
          kubectl kustomize gitops/argocd/platform
          kubectl kustomize gitops/overlays/dev
          kubectl kustomize gitops/overlays/uat
          kubectl kustomize gitops/overlays/prod
          kubectl kustomize gitops/runtime-k8s/overlays/dev
          kubectl kustomize gitops/runtime-k8s/overlays/uat
          kubectl kustomize gitops/runtime-k8s/overlays/prod
