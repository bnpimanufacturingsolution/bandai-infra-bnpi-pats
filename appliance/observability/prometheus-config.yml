# Prometheus Configuration
# Metrics scraping and alerting

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "bnpi-pats"
    environment: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # BNPI PATS API metrics
  - job_name: "bnpi-pats-api"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: "/metrics"

  # OpenTelemetry Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    scrape_interval: 10s
    scrape_timeout: 5s

  # Node Exporter (if running on host)
  - job_name: "node"
    static_configs:
      - targets: ["localhost:9100"]
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 15s
