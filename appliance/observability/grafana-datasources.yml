apiVersion: 1

datasources:
  # Prometheus/Mimir for metrics
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # Mimir for metrics (alternative)
  - name: Mimir
    type: prometheus
    uid: mimir
    url: http://mimir:9009/prometheus
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # Loki for logs
  - name: Loki
    type: loki
    uid: loki
    url: http://loki:3100
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      maxLines: 10000
      derivedFields:
        - name: traceId
          matcherRegex: 'traceId=(\w+)'
          url: $${__value.raw}
          datasourceUid: tempo

  # Tempo for traces
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    access: proxy
    isDefault: false
    editable: true
    jsonData:
      nodeGraph:
        enabled: true
      search:
        enabled: true
      spanBar:
        type: Tag
        tag: http.path

  # Alertmanager for alerts
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    url: http://alertmanager:9093
    access: proxy
    isDefault: false
    editable: true
