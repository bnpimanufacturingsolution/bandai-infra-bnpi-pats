# OpenTelemetry Collector Configuration for LGTM Stack
# Receives traces, metrics, and logs from applications
# Exports to Tempo, Mimir, and Loki

receivers:
  # OTLP receiver for traces, metrics, and logs
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "*"

  # Prometheus receiver for scraping metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: "hris-api"
          static_configs:
            - targets: ["localhost:9090"]

processors:
  # Batch processor reduces number of requests to backend
  batch:
    send_batch_size: 100
    timeout: 10s

  # Resource detection processor adds host information
  resourcedetection:
    detectors:
      - env
      - system
      - docker
      - gcp
      - azure

  # Attributes processor for adding custom attributes
  attributes:
    actions:
      - key: deployment.environment
        value: production
        action: insert
      - key: service.cluster.name
        value: k3s
        action: insert

  # Span processor for sampling and filtering
  sampling:
    sampling_percentage: 100
    # Optional: implement tail-based sampling for complex rules
    # tail_based_sampling:
    #   policies:
    #     - name: error_spans
    #       type: status_code
    #       status_code:
    #         status_codes: [ERROR]

exporters:
  # Export traces to Tempo
  otlp/tempo:
    client:
      endpoint: tempo:4317
      tls:
        insecure: true

  # Export metrics to Mimir
  prometheusremotewrite/mimir:
    endpoint: http://mimir:9009/api/prom/push
    resource_to_telemetry_conversion:
      enabled: true

  # Export logs to Loki (via JSON)
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    default_labels_enabled:
      externalhost: true
      service_name: true
      service_namespace: true

  # Console exporter for debugging
  logging:
    loglevel: debug

service:
  pipelines:
    # Traces pipeline: receive OTLP traces, batch, and export to Tempo
    traces:
      receivers: [otlp]
      processors:
        - batch
        - resourcedetection
        - attributes
      exporters: [otlp/tempo, logging]

    # Metrics pipeline: receive OTLP metrics, batch, and export to Mimir
    metrics:
      receivers: [otlp, prometheus]
      processors:
        - batch
        - resourcedetection
        - attributes
      exporters: [prometheusremotewrite/mimir]

    # Logs pipeline: receive OTLP logs and export to Loki
    logs:
      receivers: [otlp]
      processors:
        - batch
        - resourcedetection
        - attributes
      exporters: [loki]
