# Tempo Configuration
# Trace backend for distributed tracing

server:
  http_listen_port: 3200
  grpc_listen_port: 4317
  log_level: info
  log_format: json

distributor:
  rate_limit_enabled: true
  rate_limit: 10000

ingester:
  lifecycler:
    ring:
      replication_factor: 1
  traces_per_second: 10000
  max_block_duration: 5m

metrics_generator:
  registry:
    enabled: true
  storage:
    path: /var/tempo/generator/wal
    wal:
      checkpoint_duration: 5m
      truncate_frequency: 1h
  processor:
    batch:
      timeout: 10s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_mib: 1024
      spike_limit_mib: 256

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
      checkpoint_duration: 5m
      search_enabled: true

querier:
  max_search_bytes: 50000000

query_frontend:
  compression: snappy
  cache_control_header: "max-age=1h"
  results_cache:
    cache:
      enable_fifocache: true
      default_validity: 1h
      background:
        writeback_goroutines: 10
