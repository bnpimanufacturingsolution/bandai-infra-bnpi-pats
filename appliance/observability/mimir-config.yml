# Mimir Configuration
# Metrics backend compatible with Prometheus

server:
  http_listen_port: 9009
  log_level: info
  log_format: json
  grpc_server_max_concurrent_streams: 10000

distributor:
  rate_limit_enabled: true
  rate_limit: 150000
  rate_limit_by_labelnames:
    enabled: true

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  max_series_per_metric: 10000
  max_series_per_user: 1000000

blocks_storage:
  backend: local
  local:
    directory: /mimir
  tsdb:
    dir: /mimir/tsdb
    ship_interval: 1m
  retention_period: 30d

limits:
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200
  max_global_series_per_user: 1000000
  max_global_exemplars_per_user: 10000
  metric_relabel_configs: []

query_scheduler:
  max_outstanding_requests_per_tenant: 100

querier:
  cache_results: true
  max_cache_freshness_per_tenant: 10m
  results_cache:
    cache:
      enable_fifocache: true
      default_validity: 1h
      memcached:
        batch_size: 1024

  store_gateway_addresses: localhost:9009
