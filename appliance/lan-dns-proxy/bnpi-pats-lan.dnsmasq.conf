# Project Truth LAN names — do not use .local (mDNS conflict).
# Listen on appliance LAN IPs so systemd-resolved keeps 127.0.0.53 for the VM itself.
bind-interfaces
interface=eth0
listen-address=10.184.37.19
# Secondary address also answers if present
listen-address=10.184.37.78
no-resolv
server=1.1.1.1
server=8.8.8.8

# One-to-one with public *.bnpipats.tech → private *.bnpipats.lan
# All point at the appliance LAN IP; Caddy routes by Host name.
address=/bnpi-pats.lan/10.184.37.19
address=/www.bnpi-pats.lan/10.184.37.19
address=/app.bnpi-pats.lan/10.184.37.19
address=/api.bnpi-pats.lan/10.184.37.19
address=/dev.bnpi-pats.lan/10.184.37.19
address=/dev-api.bnpi-pats.lan/10.184.37.19
address=/uat.bnpi-pats.lan/10.184.37.19
address=/uat-api.bnpi-pats.lan/10.184.37.19
address=/emp.bnpi-pats.lan/10.184.37.19
address=/dev-emp.bnpi-pats.lan/10.184.37.19
address=/uat-emp.bnpi-pats.lan/10.184.37.19
address=/grafana.bnpi-pats.lan/10.184.37.19
# DB hostnames resolve for tooling (TCP still uses ports 15432-15434)
address=/db.bnpi-pats.lan/10.184.37.19
address=/dev-db.bnpi-pats.lan/10.184.37.19
address=/uat-db.bnpi-pats.lan/10.184.37.19
# SSH hostname is informational; OpenSSH is :22 not HTTP
address=/ssh.bnpi-pats.lan/10.184.37.19
