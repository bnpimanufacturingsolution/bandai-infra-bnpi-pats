# Project Truth LAN names GÇö do not use .local
# Listen only on appliance LAN IP so 127.0.0.53 systemd-resolved stays for the VM itself.
bind-interfaces
interface=eth0
listen-address=10.184.37.19
# Do not read /etc/resolv.conf for upstream (optional static upstream for client recursion)
no-resolv
server=1.1.1.1
server=8.8.8.8
# Static A records
address=/app.bnpi-hris.lan/10.184.37.19
address=/api.bnpi-hris.lan/10.184.37.19
address=/dev.bnpi-hris.lan/10.184.37.19
address=/dev-api.bnpi-hris.lan/10.184.37.19
address=/uat.bnpi-hris.lan/10.184.37.19
address=/uat-api.bnpi-hris.lan/10.184.37.19
address=/emp.bnpi-hris.lan/10.184.37.19
address=/dev-emp.bnpi-hris.lan/10.184.37.19
address=/uat-emp.bnpi-hris.lan/10.184.37.19
address=/grafana.bnpi-hris.lan/10.184.37.19
