services:
  zkteco-standalone-sdk:
    build:
      context: .
      dockerfile: Dockerfile.windows
    image: project-truth-zkteco-standalone-sdk:develop
    container_name: project-truth-zkteco-standalone-sdk
    restart: unless-stopped
    environment:
      ZKTECO_DEVICE_IPS: ${ZKTECO_DEVICE_IPS:-10.184.38.10,10.184.38.234,10.184.38.235,10.184.38.9}
      ZKTECO_DEVICE_PORT: ${ZKTECO_DEVICE_PORT:-4370}
      ZKTECO_WEBHOOK_URL: ${ZKTECO_WEBHOOK_URL:-http://10.184.38.61:3101/api/zkteco/events}
      ZKTECO_CONNECT_PASSWORD: ${ZKTECO_CONNECT_PASSWORD:-0}
      ZKTECO_MACHINE_NUMBER: ${ZKTECO_MACHINE_NUMBER:-1}
      ZKTECO_STATUS_PORT: ${ZKTECO_STATUS_PORT:-4371}
      ZKTECO_SYNC_FINGERPRINT_TEMPLATES: ${ZKTECO_SYNC_FINGERPRINT_TEMPLATES:-false}
      ZKTECO_BACKFILL_ATTENDANCE_LOGS: ${ZKTECO_BACKFILL_ATTENDANCE_LOGS:-true}
      ZKTECO_BACKFILL_MAX_EVENTS: ${ZKTECO_BACKFILL_MAX_EVENTS:-100000}
    ports:
      - "4371:4371"
