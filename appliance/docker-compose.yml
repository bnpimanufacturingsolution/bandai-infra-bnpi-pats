services:
  postgres:
    image: postgres:16-alpine
    container_name: bnpi-pats-postgres
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    ports:
      - "15432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-bnpi-pats}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  bnpi-pats-api-db-init:
    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
      target: db-init
    image: bnpi-pats-api-db-init:develop
    container_name: bnpi-pats-api-db-init
    restart: "no"
    env_file:
      - ./env/bnpi-pats-api.env
    # Empty local bootstrap may seed; UAT/PROD/GitOps must not seed.
    command: >
      sh -c "npm run prisma-postgres:push
      && npm run prisma-seed"
    depends_on:
      postgres:
        condition: service_healthy

  bnpi-pats-api:
    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
      args:
        PROJECT_TRUTH_BUILD_SHA: ${PROJECT_TRUTH_BUILD_SHA:-local-unattested}
    image: bnpi-pats-api-local:develop
    container_name: bnpi-pats-api
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    environment:
      PG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bnpi_pats
      WRITE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bnpi_pats
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: bnpi-pats-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=onprem,service.namespace=bnpi-pats
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      PROJECT_TRUTH_VM_HOST: ${PROJECT_TRUTH_VM_HOST:-10.184.37.19}
      PROJECT_TRUTH_VM_USER: ${PROJECT_TRUTH_VM_USER:-infra}
      PROJECT_TRUTH_VM_SSH_KEY: /var/run/project-truth/ssh/node-health-appliance_ed25519
    volumes:
      - apiuploads:/app/uploads
      - ../data/import:/data/import:ro
      - ../source-inputs-organized:/source-inputs-organized:ro
      - ../docs:/docs:ro
      - /var/lib/project-truth/ssh:/var/run/project-truth/ssh:ro
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-app:
    build:
      context: ../bnpi-pats-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: bnpi-pats-app-local:develop
    container_name: bnpi-pats-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BNPI_PATS_API_ORIGIN: "http://bnpi-pats-api:3001"
    ports:
      - "3000:3000"
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgresdata:
  apiuploads:

networks:
  bnpi-pats-observability:
    external: true
    name: bnpi-pats-observability
