services:
  postgres:
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    ports:
      - "15432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-hris}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  hris-api-db-init:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
      target: db-init
    image: hris-api-db-init:develop
    container_name: hris-api-db-init
    restart: "no"
    env_file:
      - ./env/hris-api.env
    command: >
      sh -c "npm run prisma-postgres:push
      && npm run prisma-seed"
    depends_on:
      postgres:
        condition: service_healthy

  hris-api:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      PG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hris
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: hris-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=onprem,service.namespace=hris
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      ZKTECO_BRIDGE_STATUS_URL: ${ZKTECO_BRIDGE_STATUS_URL:-http://zkteco-bridge:4371/status}
    volumes:
      - apiuploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - hris-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-app:
    build:
      context: ../hris-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: hris-app-local:develop
    container_name: hris-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HRIS_API_ORIGIN: "http://hris-api:3001"
    ports:
      - "3000:3000"
    networks:
      - default
      - hris-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  zkteco-bridge:
    build:
      context: ./zkteco-bridge
      dockerfile: Dockerfile
    image: project-truth-zkteco-bridge:develop
    container_name: project-truth-zkteco-bridge
    restart: unless-stopped
    environment:
      ZKTECO_DEVICE_IPS: ${ZKTECO_DEVICE_IPS:-10.184.38.10,10.184.38.234,10.184.38.235,10.184.38.9}
      ZKTECO_DEVICE_PORT: ${ZKTECO_DEVICE_PORT:-4370}
      ZKTECO_WEBHOOK_URL: ${ZKTECO_WEBHOOK_URL:-http://hris-api:3001/api/zkteco/events}
      ZKTECO_STATUS_PORT: ${ZKTECO_STATUS_PORT:-4371}
      ZKTECO_POLL_INTERVAL_SECONDS: ${ZKTECO_POLL_INTERVAL_SECONDS:-60}
    ports:
      - "4371:4371"
    depends_on:
      hris-api:
        condition: service_healthy
    networks:
      - default
      - hris-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4371/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgresdata:
  apiuploads:

networks:
  hris-observability:
    external: true
    name: hris-observability
