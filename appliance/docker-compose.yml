services:
  postgres:
    image: postgres:16-alpine
    container_name: hris-postgres
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    ports:
      - "15432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-hris}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  hris-api-db-init:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
      target: db-init
    image: hris-api-db-init:develop
    container_name: hris-api-db-init
    restart: "no"
    env_file:
      - ./env/hris-api.env
    command: >
      sh -c "npm run prisma-postgres:push
      && npm run prisma-seed"
    depends_on:
      postgres:
        condition: service_healthy

  hris-api:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      LOCAL_UPLOAD_PUBLIC_BASE_URL: http://192.168.1.54:3001
    volumes:
      - apiuploads:/app/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-app:
    build:
      context: ../hris-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: hris-app-local:develop
    container_name: hris-app
    restart: unless-stopped
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HRIS_API_ORIGIN: "http://hris-api:3001"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  zkteco-bridge:
    profiles:
      - zkteco
    build:
      context: ../vendor/zkteco-sdk
      dockerfile: Dockerfile.windows
    image: project-truth-zkteco-bridge:develop
    container_name: project-truth-zkteco-bridge
    restart: unless-stopped
    environment:
      ZKTECO_DEVICE_IPS: ${ZKTECO_DEVICE_IPS:-}
      ZKTECO_WEBHOOK_URL: ${ZKTECO_WEBHOOK_URL:-http://host.docker.internal:3001/api/zkteco/events}

volumes:
  postgresdata:
  apiuploads:
