services:
  bnpi-pats-postgres-dev:
    image: postgres:16-alpine
    container_name: bnpi-pats-postgres-dev
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    ports:
      - "15433:5432"
    volumes:
      - postgresdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-bnpi-pats}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - bnpi-pats-observability

  bnpi-pats-api-db-init-dev:
    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
      target: db-init
    image: bnpi-pats-api-db-init:develop
    container_name: bnpi-pats-api-db-init-dev
    restart: "no"
    env_file:
      - ./env/bnpi-pats-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PG_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      WRITE_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
    # No prisma-seed on appliance DBs (seed can delete timesheet/attendance). Schema-only; prisma db push without --accept-data-loss is fail-closed on destructive drift.
    command: >
      sh -c "npm run prisma-postgres:push"
    depends_on:
      bnpi-pats-postgres-dev:
        condition: service_healthy

  bnpi-pats-api-dev:
    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
      args:
        PROJECT_TRUTH_BUILD_SHA: ${PROJECT_TRUTH_BUILD_SHA:-local-unattested}
    image: bnpi-pats-api-local:develop
    container_name: bnpi-pats-api-dev
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      PG_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      WRITE_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/bnpi-pats
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: bnpi-pats-api-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.namespace=bnpi-pats
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      ZKTECO_BRIDGE_STATUS_URL: ${ZKTECO_BRIDGE_STATUS_URL_DEV:-${ZKTECO_BRIDGE_STATUS_URL:-http://zkteco-linux-bridge-dev:4371/status}}
      PROJECT_TRUTH_VM_HOST: ${PROJECT_TRUTH_VM_HOST:-10.184.37.19}
      PROJECT_TRUTH_VM_USER: ${PROJECT_TRUTH_VM_USER:-infra}
      PROJECT_TRUTH_VM_SSH_KEY: /var/run/project-truth/ssh/node-health-appliance_ed25519
      PROJECT_TRUTH_HIKVISION_RUNTIME_LOCATION: vm-container
      PROJECT_TRUTH_HIKVISION_VM_API_BASE: http://127.0.0.1:3101
    volumes:
      - apiuploads-dev:/app/uploads
      - ./backups/dev:/var/backups/bnpi-pats
      - ../data/import:/data/import:ro
      - ../source-inputs-organized:/source-inputs-organized:ro
      - ../docs:/docs:ro
      - /var/lib/project-truth/ssh:/var/run/project-truth/ssh:ro
    networks:
      - default
      - bnpi-pats-observability
    ports:
      - "3101:3001"
    depends_on:
      bnpi-pats-postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-api-cron-dev:
    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
    image: bnpi-pats-api-local:develop
    container_name: bnpi-pats-api-cron-dev
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PG_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      WRITE_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-dev:5432/bnpi_pats
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/bnpi-pats
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: bnpi-pats-api-cron-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.namespace=bnpi-pats
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOG_FORMAT: json
    command: ["node", "dist/cron.js"]
    volumes:
      - ./backups/dev:/var/backups/bnpi-pats
    networks:
      - default
      - bnpi-pats-observability
    depends_on:
      bnpi-pats-postgres-dev:
        condition: service_healthy
    healthcheck:
      disable: true

  bnpi-pats-app-dev:
    build:
      context: ../bnpi-pats-app
      dockerfile: Dockerfile
    image: bnpi-pats-app-local:develop
    container_name: bnpi-pats-app-dev
    restart: unless-stopped
    environment:
      APP_ENV: dev
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BNPI_PATS_API_ORIGIN: "http://bnpi-pats-api-dev:3001"
    volumes:
      - ../bnpi-pats-app/app/assets:/app/build/client/app/assets:ro
    ports:
      - "3100:3000"
    depends_on:
      bnpi-pats-api-dev:
        condition: service_started
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-emp-app-dev:
    build:
      context: ..
      dockerfile: appliance/dockerfiles/bnpi-pats-emp-app.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: bnpi-pats-emp-app-local:develop
    container_name: bnpi-pats-emp-app-dev
    restart: unless-stopped
    environment:
      PORT: "3000"
      BNPI_PATS_API_ORIGIN: "http://host.docker.internal:3101"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3310:3000"
    depends_on:
      bnpi-pats-api-dev:
        condition: service_started
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  zkteco-linux-bridge-dev:
    image: project-truth-zkteco-linux:develop
    container_name: project-truth-zkteco-linux-bridge-dev
    restart: unless-stopped
    command:
      - --mode
      - bridge
      - --latest
      - "${ZKTECO_SYNC_LATEST_DEV:-${ZKTECO_SYNC_LATEST:-1}}"
      - --poll-seconds
      - "${ZKTECO_POLL_SECONDS_DEV:-${ZKTECO_POLL_SECONDS:-60}}"
      - --webhook-url
      - http://bnpi-pats-api-dev:3001/api/zkteco/events
    environment:
      ZKTECO_STATUS_HOST: 0.0.0.0
      ZKTECO_STATUS_PORT: 4371
      ZKTECO_WEBHOOK_TIMEOUT: ${ZKTECO_WEBHOOK_TIMEOUT:-15}
    ports:
      - "4372:4371"
    depends_on:
      bnpi-pats-api-dev:
        condition: service_healthy
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:4371/health', timeout=5).read()\nPY"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  bnpi-pats-postgres-uat:
    image: postgres:16-alpine
    container_name: bnpi-pats-postgres-uat
    restart: unless-stopped
