services:
  hris-postgres-dev:
    image: postgres:16-alpine
    container_name: hris-postgres-dev
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    ports:
      - "15433:5432"
    volumes:
      - postgresdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-hris}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - hris-observability

  hris-api-db-init-dev:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
      target: db-init
    image: hris-api-db-init:develop
    container_name: hris-api-db-init-dev
    restart: "no"
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
    command: >
      sh -c "npm run prisma-postgres:push
      && npm run prisma-seed"
    depends_on:
      hris-postgres-dev:
        condition: service_healthy

  hris-api-dev:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api-dev
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/hris
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: hris-api-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.namespace=hris
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      ZKTECO_BRIDGE_STATUS_URL: ${ZKTECO_BRIDGE_STATUS_URL_DEV:-${ZKTECO_BRIDGE_STATUS_URL:-http://host.docker.internal:4371/status}}
    volumes:
      - apiuploads-dev:/app/uploads
      - ./backups/dev:/var/backups/hris
      - ../data/import:/data/import:ro
      - ../source-inputs-organized:/source-inputs-organized:ro
      - ../docs:/docs:ro
    networks:
      - default
      - hris-observability
    ports:
      - "3101:3001"
    depends_on:
      hris-postgres-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-api-cron-dev:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api-cron-dev
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-dev:5432/hris
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/hris
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: hris-api-cron-dev
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=dev,service.namespace=hris
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOG_FORMAT: json
    command: ["node", "dist/cron.js"]
    volumes:
      - ./backups/dev:/var/backups/hris
    networks:
      - default
      - hris-observability
    depends_on:
      hris-postgres-dev:
        condition: service_healthy
    healthcheck:
      disable: true

  hris-app-dev:
    build:
      context: ../hris-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: hris-app-local:develop
    container_name: hris-app-dev
    restart: unless-stopped
    environment:
      APP_ENV: dev
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HRIS_API_ORIGIN: "http://hris-api-dev:3001"
    volumes:
      - ../hris-app/app/assets:/app/build/client/app/assets:ro
    ports:
      - "3100:3000"
    depends_on:
      hris-api-dev:
        condition: service_started
    networks:
      - default
      - hris-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-postgres-uat:
    image: postgres:16-alpine
    container_name: hris-postgres-uat
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    ports:
      - "15434:5432"
    volumes:
      - postgresdata-uat:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-hris}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - default
      - hris-observability

  hris-api-db-init-uat:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
      target: db-init
    image: hris-api-db-init:develop
    container_name: hris-api-db-init-uat
    restart: "no"
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: production
      APP_ENV: uat
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
    command: >
      sh -c "npm run prisma-postgres:push
      && npm run prisma-seed"
    depends_on:
      hris-postgres-uat:
        condition: service_healthy

  hris-api-uat:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api-uat
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: production
      APP_ENV: uat
      STORAGE_PROVIDER: local
      LOCAL_UPLOAD_ROOT: /app/uploads
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/hris
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: hris-api-uat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=uat,service.namespace=hris
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      ZKTECO_BRIDGE_STATUS_URL: ${ZKTECO_BRIDGE_STATUS_URL_UAT:-${ZKTECO_BRIDGE_STATUS_URL:-}}
    volumes:
      - apiuploads-uat:/app/uploads
      - ./backups/uat:/var/backups/hris
      - ../data/import:/data/import:ro
      - ../source-inputs-organized:/source-inputs-organized:ro
      - ../docs:/docs:ro
    networks:
      - default
      - hris-observability
    ports:
      - "3201:3001"
    depends_on:
      hris-postgres-uat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-api-cron-uat:
    build:
      context: ../hris-api
      dockerfile: Dockerfile
    image: hris-api-local:develop
    container_name: hris-api-cron-uat
    restart: unless-stopped
    env_file:
      - ./env/hris-api.env
    environment:
      NODE_ENV: production
      APP_ENV: uat
      PG_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      WRITE_DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      DATABASE_URL: postgresql://postgres:postgres@hris-postgres-uat:5432/hris
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/hris
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: hris-api-cron-uat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=uat,service.namespace=hris
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOG_FORMAT: json
    command: ["node", "dist/cron.js"]
    volumes:
      - ./backups/uat:/var/backups/hris
    networks:
      - default
      - hris-observability
    depends_on:
      hris-postgres-uat:
        condition: service_healthy
    healthcheck:
      disable: true

  hris-app-uat:
    build:
      context: ../hris-app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: hris-app-local:develop
    container_name: hris-app-uat
    restart: unless-stopped
    environment:
      APP_ENV: uat
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      HRIS_API_ORIGIN: "http://hris-api-uat:3001"
    volumes:
      - ../hris-app/app/assets:/app/build/client/app/assets:ro
    ports:
      - "3200:3000"
    depends_on:
      hris-api-uat:
        condition: service_started
    networks:
      - default
      - hris-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  hris-grafana-uat:
    image: grafana/grafana:11.2.0
    container_name: hris-grafana-uat
    user: "0"
    ports:
      - "53002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53002
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=hris-postgres-uat
      - GF_DATABASE_NAME=grafana_uat
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../hris-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../hris-api/infrastructure/onprem/observability/grafana/provisioning-uat:/etc/grafana/provisioning:ro
    depends_on:
      hris-postgres-uat:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hris-observability

  hris-grafana-dev:
    image: grafana/grafana:11.2.0
    container_name: hris-grafana-dev
    user: "0"
    ports:
      - "53001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53001
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=hris-postgres-dev
      - GF_DATABASE_NAME=grafana_dev
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../hris-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../hris-api/infrastructure/onprem/observability/grafana/provisioning-dev:/etc/grafana/provisioning:ro
    depends_on:
      hris-postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - hris-observability

volumes:
  postgresdata-dev:
  postgresdata-uat:
  apiuploads-dev:
  apiuploads-uat:

networks:
  hris-observability:
    external: true
    name: hris-observability
