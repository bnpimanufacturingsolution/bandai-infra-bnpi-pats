      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=uat,service.namespace=bnpi-pats
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      API_ACTIVITY_LOGGING_ENABLED: "true"
      API_ACTIVITY_LOG_INCLUDE_READS: "true"
      API_ACTIVITY_LOG_EXCLUDED_PATHS: /health,/metrics
      LOG_FORMAT: json
      ZKTECO_BRIDGE_STATUS_URL: ${ZKTECO_BRIDGE_STATUS_URL_UAT:-${ZKTECO_BRIDGE_STATUS_URL:-http://zkteco-linux-bridge-uat:4371/status}}
      PROJECT_TRUTH_VM_HOST: ${PROJECT_TRUTH_VM_HOST:-10.184.37.19}
      PROJECT_TRUTH_VM_USER: ${PROJECT_TRUTH_VM_USER:-infra}
      PROJECT_TRUTH_VM_SSH_KEY: /var/run/project-truth/ssh/node-health-appliance_ed25519
      PROJECT_TRUTH_HIKVISION_RUNTIME_LOCATION: vm-container
      PROJECT_TRUTH_HIKVISION_VM_API_BASE: http://127.0.0.1:3201
    volumes:
      - apiuploads-uat:/app/uploads
      - ./backups/uat:/var/backups/bnpi-pats
      - ../data/import:/data/import:ro
      - ../source-inputs-organized:/source-inputs-organized:ro
      - ../docs:/docs:ro
      - /var/lib/project-truth/ssh:/var/run/project-truth/ssh:ro
    networks:
      - default
      - bnpi-pats-observability
    ports:
      - "3201:3001"
    depends_on:
      bnpi-pats-postgres-uat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-api-cron-uat:
    build:
