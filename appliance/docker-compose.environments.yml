    build:
      context: ../bnpi-pats-app
      dockerfile: Dockerfile
    image: bnpi-pats-app-local:develop
    container_name: bnpi-pats-app-uat
    restart: unless-stopped
    environment:
      APP_ENV: uat
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BNPI_PATS_API_ORIGIN: "http://bnpi-pats-api-uat:3001"
    volumes:
      - ../bnpi-pats-app/app/assets:/app/build/client/app/assets:ro
    ports:
      - "3200:3000"
    depends_on:
      bnpi-pats-api-uat:
        condition: service_started
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-grafana-uat:
    image: grafana/grafana:11.2.0
    container_name: bnpi-pats-grafana-uat
    user: "0"
    ports:
      - "53002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53002
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=bnpi-pats-postgres-uat
      - GF_DATABASE_NAME=grafana_uat
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/provisioning-uat:/etc/grafana/provisioning:ro
    depends_on:
      bnpi-pats-postgres-uat:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bnpi-pats-observability

  bnpi-pats-grafana-dev:
    image: grafana/grafana:11.2.0
    container_name: bnpi-pats-grafana-dev
    user: "0"
    ports:
      - "53001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53001
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=bnpi-pats-postgres-dev
      - GF_DATABASE_NAME=grafana_dev
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/provisioning-dev:/etc/grafana/provisioning:ro
    depends_on:
      bnpi-pats-postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bnpi-pats-observability

  bnpi-pats-redis-dev:
    profiles: ["redis"]
    image: redis:7.2.7-alpine
    container_name: bnpi-pats-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_DEV_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata-dev:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-template}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-template}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  bnpi-pats-redis-uat:
    profiles: ["redis"]
    image: redis:7.2.7-alpine
    container_name: bnpi-pats-redis-uat
    restart: unless-stopped
    ports:
      - "${REDIS_UAT_HOST_PORT:-6381}:6379"
    volumes:
      - redisdata-uat:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-template}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-template}' ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgresdata-dev:
  postgresdata-uat:
  apiuploads-dev:
  apiuploads-uat:
  redisdata-dev:
  redisdata-uat:

networks:
  bnpi-pats-observability:
    external: true
    name: bnpi-pats-observability
