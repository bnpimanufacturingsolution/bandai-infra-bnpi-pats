      - http://bnpi-pats-api-uat:3001/api/zkteco/events
    environment:
      ZKTECO_STATUS_HOST: 0.0.0.0
      ZKTECO_STATUS_PORT: 4371
      ZKTECO_WEBHOOK_TIMEOUT: ${ZKTECO_WEBHOOK_TIMEOUT:-15}
    ports:
      - "4373:4371"
    depends_on:
      bnpi-pats-api-uat:
        condition: service_healthy
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:4371/health', timeout=5).read()\nPY"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  bnpi-pats-grafana-uat:
    image: grafana/grafana:11.2.0
    container_name: bnpi-pats-grafana-uat
    user: "0"
    ports:
      - "53002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53002
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=bnpi-pats-postgres-uat
      - GF_DATABASE_NAME=grafana_uat
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/provisioning-uat:/etc/grafana/provisioning:ro
    depends_on:
      bnpi-pats-postgres-uat:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bnpi-pats-observability

  bnpi-pats-grafana-dev:
    image: grafana/grafana:11.2.0
    container_name: bnpi-pats-grafana-dev
    user: "0"
    ports:
      - "53001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
      - GF_SERVER_ROOT_URL=http://localhost:53001
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=bnpi-pats-postgres-dev
      - GF_DATABASE_NAME=grafana_dev
      - GF_DATABASE_USER=postgres
      - GF_DATABASE_PASSWORD=postgres
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ../bnpi-pats-api/infrastructure/onprem/observability/grafana/provisioning-dev:/etc/grafana/provisioning:ro
    depends_on:
      bnpi-pats-postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bnpi-pats-observability

volumes:
  postgresdata-dev:
  postgresdata-uat:
  apiuploads-dev:
  apiuploads-uat:

networks:
  bnpi-pats-observability:
    external: true
    name: bnpi-pats-observability
