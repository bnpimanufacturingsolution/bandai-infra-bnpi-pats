    build:
      context: ../bnpi-pats-api
      dockerfile: Dockerfile
    image: bnpi-pats-api-local:develop
    container_name: bnpi-pats-api-cron-uat
    restart: unless-stopped
    env_file:
      - ./env/bnpi-pats-api.env
    environment:
      NODE_ENV: production
      APP_ENV: uat
      PG_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-uat:5432/bnpi_pats
      WRITE_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-uat:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-uat:5432/bnpi_pats
      BACKUP_ENABLED: "true"
      BACKUP_TIMEZONE: Asia/Manila
      BACKUP_CRON: "0 12 * * *"
      BACKUP_DIR: /var/backups/bnpi-pats
      BACKUP_RETENTION_DAYS: "0"
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: bnpi-pats-api-cron-uat
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment=uat,service.namespace=bnpi-pats
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: "1.0"
      LOG_FORMAT: json
    command: ["node", "dist/cron.js"]
    volumes:
      - ./backups/uat:/var/backups/bnpi-pats
    networks:
      - default
