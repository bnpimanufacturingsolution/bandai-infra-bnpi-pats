      WRITE_DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-uat:5432/bnpi_pats
      DATABASE_URL: postgresql://postgres:postgres@bnpi-pats-postgres-uat:5432/bnpi_pats
      BACKUP_ENABLED: "true"
