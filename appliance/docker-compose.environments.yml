      dockerfile: Dockerfile
    image: bnpi-pats-app-local:develop
    container_name: bnpi-pats-app-uat
    restart: unless-stopped
    environment:
      APP_ENV: uat
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      BNPI_PATS_API_ORIGIN: "http://bnpi-pats-api-uat:3001"
    volumes:
      - ../bnpi-pats-app/app/assets:/app/build/client/app/assets:ro
    ports:
      - "3200:3000"
    depends_on:
      bnpi-pats-api-uat:
        condition: service_started
    networks:
      - default
      - bnpi-pats-observability
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  bnpi-pats-emp-app-uat:
    build:
      context: ..
      dockerfile: appliance/dockerfiles/bnpi-pats-emp-app.Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: bnpi-pats-emp-app-local:develop
    container_name: bnpi-pats-emp-app-uat
