name: Firebase Hosting Pipeline

on:
  push:
    branches:
      - develop
      - uat
  pull_request:
    branches:
      - develop
      - uat

permissions:
  checks: write
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('firebase-pipeline-pr-{0}', github.event.pull_request.number) || format('firebase-pipeline-{0}', github.ref_name) }}
  cancel-in-progress: true

jobs:
  test_obligations:
    name: Test Obligations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') || github.ref_name == 'uat' && (vars.VITE_API_BASE_URL_UAT || 'https://hris-api-uat-161377059311.asia-southeast1.run.app') || (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') }}
      VITE_CLOUDINARY_PATH: ${{ github.event_name == 'pull_request' && secrets.VITE_CLOUDINARY_PATH_DEV || github.ref_name == 'uat' && secrets.VITE_CLOUDINARY_PATH_UAT || secrets.VITE_CLOUDINARY_PATH_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test obligations
        run: npm run test:obligations

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') || github.ref_name == 'uat' && (vars.VITE_API_BASE_URL_UAT || 'https://hris-api-uat-161377059311.asia-southeast1.run.app') || (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') }}
      VITE_CLOUDINARY_PATH: ${{ github.event_name == 'pull_request' && secrets.VITE_CLOUDINARY_PATH_DEV || github.ref_name == 'uat' && secrets.VITE_CLOUDINARY_PATH_UAT || secrets.VITE_CLOUDINARY_PATH_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm run test:ci

  e2e_smoke:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test_obligations
      - tests
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') || github.ref_name == 'uat' && (vars.VITE_API_BASE_URL_UAT || 'https://hris-api-uat-161377059311.asia-southeast1.run.app') || (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') }}
      VITE_CLOUDINARY_PATH: ${{ github.event_name == 'pull_request' && secrets.VITE_CLOUDINARY_PATH_DEV || github.ref_name == 'uat' && secrets.VITE_CLOUDINARY_PATH_UAT || secrets.VITE_CLOUDINARY_PATH_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - test_obligations
      - tests
      - e2e_smoke
    env:
      VITE_API_BASE_URL: ${{ github.event_name == 'pull_request' && (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') || github.ref_name == 'uat' && (vars.VITE_API_BASE_URL_UAT || 'https://hris-api-uat-161377059311.asia-southeast1.run.app') || (vars.VITE_API_BASE_URL_DEV || 'https://hris-api-dev-161377059311.asia-southeast1.run.app') }}
      VITE_CLOUDINARY_PATH: ${{ github.event_name == 'pull_request' && secrets.VITE_CLOUDINARY_PATH_DEV || github.ref_name == 'uat' && secrets.VITE_CLOUDINARY_PATH_UAT || secrets.VITE_CLOUDINARY_PATH_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Upload Firebase build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firebase-build-${{ github.sha }}
          path: build/client
          if-no-files-found: error
          retention-days: 3

  deploy_preview:
    name: Deploy Preview
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_DEV || 'hris-workforce-dev-20260416' }}
      FIREBASE_TARGET: dev
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HRIS_APP_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deploy dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove checked-in build output
        run: rm -rf build/client

      - name: Download Firebase preview build artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-build-${{ github.sha }}
          path: build/client

      - name: Verify hosting build output
        run: |
          if [ ! -f build/client/index.html ]; then
            echo "Firebase preview artifact did not contain build/client/index.html."
            echo "Downloaded build/client contents:"
            find build/client -maxdepth 3 -type f | sort | head -50 || true
            exit 1
          fi

      - name: Validate Firebase preview credentials
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing FIREBASE_PROJECT_ID for PR preview deploy"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT secret for PR preview deploy"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          if ! jq -e '.client_email and .private_key and .project_id' "$RUNNER_TEMP/firebase-sa.json" >/dev/null; then
            echo "Firebase service account JSON is invalid or incomplete."
            exit 1
          fi
          SA_PROJECT_ID="$(jq -r '.project_id' "$RUNNER_TEMP/firebase-sa.json")"
          if [ "$SA_PROJECT_ID" != "$FIREBASE_PROJECT_ID" ]; then
            echo "Service account project_id does not match FIREBASE_PROJECT_ID."
            exit 1
          fi

      - name: Configure Google credentials
        run: |
          cp "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Resolve Hosting Site From Target
        run: |
          SITE_ID="$(node -e "const fs=require('fs'); const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8')); const p=process.env.FIREBASE_PROJECT_ID; const t=process.env.FIREBASE_TARGET; const site=((((rc.targets||{})[p]||{}).hosting||{})[t]||[])[0]||''; process.stdout.write(site);")"
          if [ -z "$SITE_ID" ]; then
            echo "No hosting site mapped for project '$FIREBASE_PROJECT_ID' and target '$FIREBASE_TARGET' in .firebaserc"
            exit 1
          fi

          echo "Resolved hosting site: $SITE_ID"
          PREVIEW_CONFIG="$GITHUB_WORKSPACE/.firebase-hosting-preview.json"
          echo "FIREBASE_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"
          echo "FIREBASE_PREVIEW_CONFIG=$GITHUB_WORKSPACE/.firebase-hosting-preview.json" >> "$GITHUB_ENV"

          FIREBASE_SITE_ID="$SITE_ID" FIREBASE_PREVIEW_CONFIG="$PREVIEW_CONFIG" node <<'NODE'
          const fs = require("node:fs");

          const source = JSON.parse(fs.readFileSync("firebase.json", "utf8"));
          const hostingEntries = Array.isArray(source.hosting)
            ? source.hosting
            : [source.hosting].filter(Boolean);
          const targetConfig = hostingEntries.find(
            (entry) => entry.target === process.env.FIREBASE_TARGET,
          );

          if (!targetConfig) {
            console.error(
              `No hosting target '${process.env.FIREBASE_TARGET}' found in firebase.json`,
            );
            process.exit(1);
          }

          const previewConfig = {
            ...source,
            hosting: {
              ...targetConfig,
              site: process.env.FIREBASE_SITE_ID,
            },
          };
          delete previewConfig.hosting.target;

          fs.writeFileSync(
            process.env.FIREBASE_PREVIEW_CONFIG,
            `${JSON.stringify(previewConfig, null, 2)}\n`,
          );
          NODE

      - name: Verify preview config hosting path
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const configPath = process.env.FIREBASE_PREVIEW_CONFIG;
          const config = JSON.parse(fs.readFileSync(configPath, "utf8"));
          const hosting = Array.isArray(config.hosting) ? config.hosting[0] : config.hosting;
          const resolvedPublic = path.resolve(path.dirname(configPath), hosting.public);
          const expectedPublic = path.resolve(process.env.GITHUB_WORKSPACE, "build/client");

          if (resolvedPublic !== expectedPublic) {
            console.error(`Firebase preview public path resolves to ${resolvedPublic}`);
            console.error(`Expected ${expectedPublic}`);
            process.exit(1);
          }

          if (!fs.existsSync(path.join(resolvedPublic, "index.html"))) {
            console.error(`Firebase preview public path is missing index.html: ${resolvedPublic}`);
            process.exit(1);
          }
          NODE

      - name: Preflight Hosting Access
        run: |
          set +e
          SITES_OUTPUT="$(npx firebase-tools hosting:sites:list --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1)"
          EXIT_CODE=$?
          set -e
          echo "$SITES_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Unable to list hosting sites. Check Firebase Hosting permissions for the service account."
            exit $EXIT_CODE
          fi
          if ! echo "$SITES_OUTPUT" | grep -q "$FIREBASE_SITE_ID"; then
            echo "Resolved site '$FIREBASE_SITE_ID' is not visible in project '$FIREBASE_PROJECT_ID'."
            echo "Check .firebaserc target mapping or create the Hosting site in Firebase."
            exit 1
          fi

      - name: Deploy preview channel
        run: >
          npx firebase-tools hosting:channel:deploy pr-${{ github.event.pull_request.number }}
          --project "$FIREBASE_PROJECT_ID"
          --config "$FIREBASE_PREVIEW_CONFIG"
          --expires 7d
          --non-interactive

  deploy_hosting:
    name: Deploy to Firebase Hosting
    needs: build
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'develop' || github.ref_name == 'uat') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'uat' && 'uat' || 'dev' }}
    env:
      FIREBASE_PROJECT_ID: ${{ github.ref_name == 'uat' && (vars.FIREBASE_PROJECT_ID_UAT || 'hris-workforce-uat-20260416') || (vars.FIREBASE_PROJECT_ID_DEV || 'hris-workforce-dev-20260416') }}
      FIREBASE_TARGET: ${{ github.ref_name == 'uat' && 'uat' || 'dev' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ github.ref_name == 'uat' && (secrets.FIREBASE_SERVICE_ACCOUNT_UAT || secrets.FIREBASE_SERVICE_ACCOUNT_HRIS_APP_UAT || secrets.FIREBASE_SERVICE_ACCOUNT_HRIS_UAT) || (secrets.FIREBASE_SERVICE_ACCOUNT_DEV || secrets.FIREBASE_SERVICE_ACCOUNT_HRIS_APP_DEV) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deploy dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove checked-in build output
        run: rm -rf build/client

      - name: Download Firebase build artifact
        uses: actions/download-artifact@v4
        with:
          name: firebase-build-${{ github.sha }}
          path: build/client

      - name: Validate Firebase deploy secrets
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "Missing FIREBASE_PROJECT_ID for branch: ${{ github.ref_name }}"
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT secret for branch: ${{ github.ref_name }}"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          if ! jq -e '.client_email and .private_key and .project_id' "$RUNNER_TEMP/firebase-sa.json" >/dev/null; then
            echo "Firebase service account JSON is invalid or incomplete."
            exit 1
          fi
          SA_PROJECT_ID="$(jq -r '.project_id' "$RUNNER_TEMP/firebase-sa.json")"
          echo "Service account project: $SA_PROJECT_ID"
          echo "Deploy project: $FIREBASE_PROJECT_ID"
          echo "Deploy target: $FIREBASE_TARGET"
          if [ "$SA_PROJECT_ID" != "$FIREBASE_PROJECT_ID" ]; then
            echo "Service account project_id does not match FIREBASE_PROJECT_ID."
            echo "Update FIREBASE_SERVICE_ACCOUNT_${{ github.ref_name == 'uat' && 'UAT' || 'DEV' }} with a key from project $FIREBASE_PROJECT_ID."
            exit 1
          fi

      - name: Resolve Hosting Site From Target
        run: |
          SITE_ID="$(node -e "const fs=require('fs'); const rc=JSON.parse(fs.readFileSync('.firebaserc','utf8')); const p=process.env.FIREBASE_PROJECT_ID; const t=process.env.FIREBASE_TARGET; const site=((((rc.targets||{})[p]||{}).hosting||{})[t]||[])[0]||''; process.stdout.write(site);")"
          if [ -z "$SITE_ID" ]; then
            echo "No hosting site mapped for project '$FIREBASE_PROJECT_ID' and target '$FIREBASE_TARGET' in .firebaserc"
            exit 1
          fi
          echo "Resolved hosting site: $SITE_ID"
          echo "FIREBASE_SITE_ID=$SITE_ID" >> "$GITHUB_ENV"

      - name: Configure Google credentials
        run: |
          cp "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/gcp-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> "$GITHUB_ENV"

      - name: Preflight Hosting Access
        run: |
          set +e
          SITES_OUTPUT="$(npx firebase-tools hosting:sites:list --project "$FIREBASE_PROJECT_ID" --non-interactive 2>&1)"
          EXIT_CODE=$?
          set -e
          echo "$SITES_OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "Unable to list hosting sites. Check Firebase Hosting permissions for the service account."
            exit $EXIT_CODE
          fi
          if ! echo "$SITES_OUTPUT" | grep -q "$FIREBASE_SITE_ID"; then
            echo "Resolved site '$FIREBASE_SITE_ID' is not visible in project '$FIREBASE_PROJECT_ID'."
            echo "Check .firebaserc target mapping or create the Hosting site in Firebase."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        run: >
          npx firebase-tools deploy
          --project "$FIREBASE_PROJECT_ID"
          --only "hosting:$FIREBASE_TARGET"
          --non-interactive
