global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets: ['tempo:3200']

  - job_name: otel_collector
    metrics_path: /metrics
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: promtail
    metrics_path: /metrics
    static_configs:
      - targets: ['promtail:9080']

  - job_name: node_exporter
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: hris_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001
        labels:
          environment: prod
      - targets:
          - host.docker.internal:3101
        labels:
          environment: dev
      - targets:
          - host.docker.internal:3201
        labels:
          environment: uat

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3001/health
          - http://host.docker.internal:3000/health
          - http://host.docker.internal:3300/health
        labels:
          environment: prod
      - targets:
          - http://host.docker.internal:3101/health
          - http://host.docker.internal:3100/health
          - http://host.docker.internal:3310/health
        labels:
          environment: dev
      - targets:
          - http://host.docker.internal:3201/health
          - http://host.docker.internal:3200/health
          - http://host.docker.internal:3320/health
        labels:
          environment: uat
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
