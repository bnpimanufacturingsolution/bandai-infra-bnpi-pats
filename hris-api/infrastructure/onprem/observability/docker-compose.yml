services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: hris-otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    ports:
      - "${OTEL_COLLECTOR_GRPC_HOST_PORT:-4317}:4317"
      - "${OTEL_COLLECTOR_HTTP_HOST_PORT:-4318}:4318"
      - "${OTEL_COLLECTOR_METRICS_HOST_PORT:-8889}:8889"
    volumes:
      - ./otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped
    networks:
      - observability

  tempo:
    image: grafana/tempo:2.6.1
    container_name: hris-tempo
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yml
      - -config.expand-env=true
    environment:
      - TEMPO_RETENTION=${TEMPO_RETENTION:-168h}
    ports:
      - "${TEMPO_HOST_PORT:-3202}:3200"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/tempo:/var/tempo
    restart: unless-stopped
    networks:
      - observability

  loki:
    image: grafana/loki:3.1.1
    container_name: hris-loki
    user: "0"
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_HOST_PORT:-3110}:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/loki:/loki
    restart: unless-stopped
    networks:
      - observability

  promtail:
    image: grafana/promtail:3.1.1
    container_name: hris-promtail
    command:
      - -config.file=/etc/promtail/promtail-config.yml
      - -config.expand-env=true
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hris-prometheus
    user: "0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      - --web.enable-admin-api
    ports:
      - "${PROMETHEUS_HOST_PORT:-9091}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/prometheus:/prometheus
    depends_on:
      - cadvisor
      - node-exporter
      - alertmanager
      - blackbox-exporter
      - otel-collector
      - tempo
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - observability

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: hris-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/alertmanager:/alertmanager
    restart: unless-stopped
    networks:
      - observability

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: hris-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "${BLACKBOX_HOST_PORT:-9115}:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    networks:
      - observability

  postgres:
    image: postgres:16-alpine
    container_name: hris-observability-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_GRAFANA_DB:-grafana}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_OBSERVABILITY_HOST_PORT:-15435}:5432"
    volumes:
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/postgres:/var/lib/postgresql/data
      - ./grafana/init-grafana-db.sh:/docker-entrypoint-initdb.d/init-grafana-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_GRAFANA_DB:-grafana}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:11.2.0
    container_name: hris-grafana
    user: "0"
    ports:
      - "${GRAFANA_HOST_PORT:-53000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN:-localhost}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:53000}
      - GF_LOG_MODE=console
      - GF_LOG_LEVEL=info
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # Use dedicated PostgreSQL database instead of local SQLite
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres
      - GF_DATABASE_NAME=${POSTGRES_GRAFANA_DB:-grafana}
      - GF_DATABASE_USER=${POSTGRES_USER:-postgres}
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - GF_DATABASE_SSL_MODE=disable
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Database is now PostgreSQL (grafana DB). No local SQLite file used for core data.
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
      alertmanager:
        condition: service_started
    restart: unless-stopped
    networks:
      - observability

  backup:
    image: alpine:3.20
    container_name: hris-observability-backup
    working_dir: /backup
    command: ["sh", "/backup/loop.sh"]
    environment:
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-3600}
      - BACKUP_KEEP_ROLLING=${BACKUP_KEEP_ROLLING:-48}
      - BACKUP_KEEP_FULL=${BACKUP_KEEP_FULL:-30}
      - FULL_FREQUENCY=${FULL_FREQUENCY:-daily}
      - BACKUP_ROOT=/backups
    volumes:
      - ./backup:/backup:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/backups:/backups
      # grafana data is now in PostgreSQL database, no longer using local volume
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/prometheus:/data/prometheus:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/loki:/data/loki:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/tempo:/data/tempo:ro
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/alertmanager:/data/alertmanager:ro
    depends_on:
      - grafana
      - prometheus
      - loki
      - tempo
      - alertmanager
    restart: unless-stopped
    networks:
      - observability

  backup-replicator:
    image: rclone/rclone:1.68.2
    container_name: hris-observability-replicator
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        while true; do
          if [ "$${REMOTE_REPLICATION_ENABLED:-false}" = "true" ]; then
            rclone copy /backups "$${RCLONE_REMOTE_PATH}" \
              --config /config/rclone/rclone.conf \
              --create-empty-src-dirs \
              --fast-list \
              --transfers "$${RCLONE_TRANSFERS:-4}" \
              --checkers "$${RCLONE_CHECKERS:-8}" \
              --log-level "$${RCLONE_LOG_LEVEL:-INFO}" \
              --stats 30s || true;
          fi;
          sleep "$${REPLICATION_INTERVAL_SECONDS:-1800}";
        done
    environment:
      - REMOTE_REPLICATION_ENABLED=${REMOTE_REPLICATION_ENABLED:-false}
      - RCLONE_REMOTE_PATH=${RCLONE_REMOTE_PATH:-}
      - REPLICATION_INTERVAL_SECONDS=${REPLICATION_INTERVAL_SECONDS:-1800}
      - RCLONE_TRANSFERS=${RCLONE_TRANSFERS:-4}
      - RCLONE_CHECKERS=${RCLONE_CHECKERS:-8}
      - RCLONE_LOG_LEVEL=${RCLONE_LOG_LEVEL:-INFO}
    volumes:
      - ${OBSERVABILITY_DATA_ROOT:-/srv/hris/observability}/backups:/backups:ro
      - ./rclone:/config/rclone:ro
    depends_on:
      - backup
    restart: unless-stopped
    networks:
      - observability

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: hris-node-exporter
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro
    ports:
      - "${NODE_EXPORTER_HOST_PORT:-9110}:9100"
    restart: unless-stopped
    networks:
      - observability

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: hris-cadvisor
    ports:
      - "${CADVISOR_HOST_PORT:-8088}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - observability

networks:
  observability:
    external: true
    name: hris-observability
