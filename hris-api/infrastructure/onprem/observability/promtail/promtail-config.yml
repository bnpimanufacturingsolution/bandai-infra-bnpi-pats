server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'hris-(api|app|postgres|grafana)$'
        target_label: environment
        replacement: prod
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'hris-(api|app|postgres|grafana)-dev$'
        target_label: environment
        replacement: dev
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: 'hris-(api|app|postgres|grafana)-uat$'
        target_label: environment
        replacement: uat
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
      - target_label: stack
        replacement: hris-observability
    pipeline_stages:
      - docker: {}
      - labels:
          container:
          service:
          environment:
          compose_project:
          stream:
          stack:

  # Project Truth DEV/UAT/PROD application workloads run in K3s/containerd,
  # not Docker Compose. Read the CRI pod logs directly so Grafana can correlate
  # a durable credential job ID with its API/device stages.
  - job_name: k3s-pods
    static_configs:
      - targets:
          - localhost
        labels:
          job: k3s-pods
          stack: hris-k3s
          __path__: /var/log/pods/*/*/*.log
    pipeline_stages:
      - cri: {}
      - regex:
          source: filename
          expression: '/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_[^/]+/(?P<container>[^/]+)/.*\.log'
      - template:
          source: environment
          template: '{{ .namespace }}'
      - labels:
          namespace:
          environment:
          pod:
          container:
          job:
          stack:
