services:
    postgres:
        image: postgres:16-alpine
        container_name: template-postgres
        environment:
            - POSTGRES_DB=${POSTGRES_DB:-hris}
            - POSTGRES_USER=${POSTGRES_USER:-postgres}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
        ports:
            - "${POSTGRES_HOST_PORT:-5432}:5432"
        volumes:
            - postgresdata:/var/lib/postgresql/data
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hris}"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    minio:
        image: minio/minio:latest
        container_name: template-minio
        command: ["server", "/data", "--console-address", ":9001"]
        environment:
            - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - "${MINIO_HOST_PORT:-9000}:9000"
            - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
        volumes:
            - miniodata:/data
        restart: unless-stopped

    minio-init:
        image: minio/mc:latest
        container_name: template-minio-init
        restart: "no"
        depends_on:
            minio:
                condition: service_started
        entrypoint: >
            /bin/sh -c "
            until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done &&
            mc mb -p local/${MINIO_BUCKET:-hris-images} || true &&
            mc mb -p local/${MINIO_BACKUP_BUCKET:-hris-backups} || true &&
            mc anonymous set download local/${MINIO_BUCKET:-hris-images} || true
            "

    mongodb:
        image: mongo:7
        container_name: template-mongodb
        command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
        ports:
            - "27018:27017"
        volumes:
            - mongodbdata:/data/db
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
            interval: 10s
            timeout: 5s
            retries: 10

    mongo-init:
        image: mongo:7
        container_name: template-mongo-init
        restart: "no"
        depends_on:
            mongodb:
                condition: service_healthy
        command:
            [
                "sh",
                "-c",
                "mongosh --host mongodb:27017 --quiet --eval \"try { rs.status(); } catch (e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}); }\"",
            ]

    redis:
        image: redis:7.2-alpine
        container_name: template-redis
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data
        command: ["redis-server", "--appendonly", "yes", "--requirepass", "template"]
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"
        healthcheck:
            test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: template-app
        env_file:
            - .env
        environment:
            # Override MongoDB host for Docker networking
            - DATABASE_URL=mongodb://mongodb:27017/hris?replicaSet=rs0
            # Override Redis host for Docker networking
            - REDIS_HOST=redis
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            # On-prem object storage defaults
            - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
            - MINIO_BUCKET=${MINIO_BUCKET:-hris-images}
            - MINIO_PUBLIC_BASE_URL=${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
        ports:
            - "${APP_HOST_PORT:-58001}:${PORT:-3001}"
        depends_on:
            mongodb:
                condition: service_healthy
            mongo-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            minio:
                condition: service_started
            minio-init:
                condition: service_completed_successfully

    cron:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: template-cron
        env_file:
            - .env
        environment:
            # Override MongoDB host for Docker networking
            - DATABASE_URL=mongodb://mongodb:27017/hris?replicaSet=rs0
            # Override Redis host for Docker networking
            - REDIS_HOST=redis
            - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
            # On-prem object storage defaults
            - STORAGE_PROVIDER=${STORAGE_PROVIDER:-minio}
            - MINIO_ENDPOINT=minio
            - MINIO_PORT=9000
            - MINIO_USE_SSL=false
            - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
            - MINIO_BUCKET=${MINIO_BUCKET:-hris-images}
            - MINIO_PUBLIC_BASE_URL=${MINIO_PUBLIC_BASE_URL:-http://localhost:9000}
        command: ["node", "dist/cron.js"]
        healthcheck:
            disable: true
        depends_on:
            mongodb:
                condition: service_healthy
            mongo-init:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            app:
                condition: service_started
            minio:
                condition: service_started

    minio-backup:
        image: minio/mc:latest
        container_name: template-minio-backup
        depends_on:
            minio:
                condition: service_started
            minio-init:
                condition: service_completed_successfully
        environment:
            - MINIO_BACKUP_ENABLED=${MINIO_BACKUP_ENABLED:-false}
            - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
            - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
            - MINIO_BUCKET=${MINIO_BUCKET:-hris-images}
            - MINIO_BACKUP_INTERVAL_SECONDS=${MINIO_BACKUP_INTERVAL_SECONDS:-1800}
            - GCS_S3_ACCESS_KEY=${GCS_S3_ACCESS_KEY:-}
            - GCS_S3_SECRET_KEY=${GCS_S3_SECRET_KEY:-}
            - GCS_BACKUP_BUCKET=${GCS_BACKUP_BUCKET:-}
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
            while true; do
              if [ \"${MINIO_BACKUP_ENABLED:-false}\" = \"true\" ] && [ -n \"${GCS_BACKUP_BUCKET}\" ] && [ -n \"${GCS_S3_ACCESS_KEY}\" ] && [ -n \"${GCS_S3_SECRET_KEY}\" ]; then
                mc alias set gcs https://storage.googleapis.com ${GCS_S3_ACCESS_KEY} ${GCS_S3_SECRET_KEY};
                mc mirror --overwrite --remove local/${MINIO_BUCKET:-hris-images} gcs/${GCS_BACKUP_BUCKET};
              fi;
              sleep ${MINIO_BACKUP_INTERVAL_SECONDS:-1800};
            done
            "
        restart: unless-stopped

volumes:
    mongodbdata:
    postgresdata:
    redisdata:
    miniodata:
