services:
  pg-primary:
    image: bitnamilegacy/postgresql:16
    container_name: hris-pg-primary
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=hris
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
    ports:
      - "55432:5432"
    volumes:
      - pg_primary_data:/bitnami/postgresql

  pg-replica-1:
    image: bitnamilegacy/postgresql:16
    container_name: hris-pg-replica-1
    depends_on:
      - pg-primary
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=hris
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
    ports:
      - "55433:5432"
    volumes:
      - pg_replica_1_data:/bitnami/postgresql

  pg-replica-2:
    image: bitnamilegacy/postgresql:16
    container_name: hris-pg-replica-2
    depends_on:
      - pg-primary
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=hris
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
    ports:
      - "55434:5432"
    volumes:
      - pg_replica_2_data:/bitnami/postgresql

  pg-replica-3:
    image: bitnamilegacy/postgresql:16
    container_name: hris-pg-replica-3
    depends_on:
      - pg-primary
    environment:
      - POSTGRESQL_POSTGRES_PASSWORD=postgres
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
      - POSTGRESQL_DATABASE=hris
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_MASTER_HOST=pg-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_pass
    ports:
      - "55435:5432"
    volumes:
      - pg_replica_3_data:/bitnami/postgresql

volumes:
  pg_primary_data:
  pg_replica_1_data:
  pg_replica_2_data:
  pg_replica_3_data:
