name: GCP Cloud Run Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - develop
          - uat
      revision:
        description: "Cloud Run revision name (example: hris-api-dev-00010-abc)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-rollback-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback Cloud Run Revision
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GCP_PROJECT_ID_DEV: ${{ secrets.GCP_PROJECT_ID_DEV }}
      GCP_PROJECT_ID_UAT: ${{ secrets.GCP_PROJECT_ID_UAT }}
      GCP_REGION_DEV: ${{ secrets.GCP_REGION_DEV }}
      GCP_REGION_UAT: ${{ secrets.GCP_REGION_UAT }}
      CLOUD_RUN_SERVICE_DEV: ${{ secrets.CLOUD_RUN_SERVICE_DEV }}
      CLOUD_RUN_SERVICE_UAT: ${{ secrets.CLOUD_RUN_SERVICE_UAT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_DEV: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
      GCP_WORKLOAD_IDENTITY_PROVIDER_UAT: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_UAT }}
      GCP_SERVICE_ACCOUNT_EMAIL_DEV: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_DEV }}
      GCP_SERVICE_ACCOUNT_EMAIL_UAT: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL_UAT }}

    steps:
      - name: Resolve rollback environment
        run: |
          target_env="${{ github.event.inputs.environment }}"
          case "$target_env" in
            develop)
              echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_DEV" >> "$GITHUB_ENV"
              echo "GCP_REGION=$GCP_REGION_DEV" >> "$GITHUB_ENV"
              echo "CLOUD_RUN_SERVICE=$CLOUD_RUN_SERVICE_DEV" >> "$GITHUB_ENV"
              echo "GCP_WORKLOAD_IDENTITY_PROVIDER=$GCP_WORKLOAD_IDENTITY_PROVIDER_DEV" >> "$GITHUB_ENV"
              echo "GCP_SERVICE_ACCOUNT_EMAIL=$GCP_SERVICE_ACCOUNT_EMAIL_DEV" >> "$GITHUB_ENV"
              ;;
            uat)
              echo "GCP_PROJECT_ID=$GCP_PROJECT_ID_UAT" >> "$GITHUB_ENV"
              echo "GCP_REGION=$GCP_REGION_UAT" >> "$GITHUB_ENV"
              echo "CLOUD_RUN_SERVICE=$CLOUD_RUN_SERVICE_UAT" >> "$GITHUB_ENV"
              echo "GCP_WORKLOAD_IDENTITY_PROVIDER=$GCP_WORKLOAD_IDENTITY_PROVIDER_UAT" >> "$GITHUB_ENV"
              echo "GCP_SERVICE_ACCOUNT_EMAIL=$GCP_SERVICE_ACCOUNT_EMAIL_UAT" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported environment: $target_env"
              exit 1
              ;;
          esac

      - name: Validate required rollback config
        run: |
          required=(GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL)
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud via Workload Identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify target revision exists
        env:
          TARGET_REVISION: ${{ github.event.inputs.revision }}
        run: |
          gcloud run revisions describe "$TARGET_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format "value(metadata.name)" >/dev/null

      - name: Shift 100% traffic to target revision
        env:
          TARGET_REVISION: ${{ github.event.inputs.revision }}
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-revisions "$TARGET_REVISION=100"

      - name: Show final traffic status
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format "yaml(status.latestReadyRevisionName,status.traffic,status.url,status.conditions)"
