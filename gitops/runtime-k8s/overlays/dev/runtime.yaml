apiVersion: v1
kind: Secret
metadata:
  name: hris-postgres-env
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: hris
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hris-postgres-dev
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-dev
  hostPath:
    path: /var/lib/project-truth/k8s/dev/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hris-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-dev
  resources:
    requests:
      storage: 20Gi
  volumeName: hris-postgres-dev
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hris-uploads-dev
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-dev
  hostPath:
    path: /var/lib/project-truth/k8s/dev/uploads
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hris-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-dev
  resources:
    requests:
      storage: 20Gi
  volumeName: hris-uploads-dev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hris-postgres
  labels:
    app.kubernetes.io/name: hris-postgres
    app.kubernetes.io/part-of: project-truth
spec:
  serviceName: hris-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hris-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-postgres
        app.kubernetes.io/part-of: project-truth
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          envFrom:
            - secretRef:
                name: hris-postgres-env
          ports:
            - name: postgres
              containerPort: 5432
              hostPort: 15433
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: hris-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: hris-postgres
spec:
  selector:
    app.kubernetes.io/name: hris-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hris-api-db-init
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-api-db-init
        app.kubernetes.io/part-of: project-truth
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: hris-api-db-init:develop
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - npm run prisma-postgres:push && npm run prisma-seed
          env:
            - name: NODE_ENV
              value: development
            - name: APP_ENV
              value: dev
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hris-api
  labels:
    app.kubernetes.io/name: hris-api
    app.kubernetes.io/part-of: project-truth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hris-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-api
        app.kubernetes.io/part-of: project-truth
    spec:
      containers:
        - name: api
          image: hris-api-local:develop
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: development
            - name: APP_ENV
              value: dev
            - name: JWT_SECRET
              value: project-truth-local-appliance-jwt-secret-change-me
            - name: PORT
              value: "3001"
            - name: STORAGE_PROVIDER
              value: local
            - name: LOCAL_UPLOAD_ROOT
              value: /app/uploads
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: OTEL_ENABLED
              value: "false"
            - name: API_ACTIVITY_LOGGING_ENABLED
              value: "true"
            - name: API_ACTIVITY_LOG_INCLUDE_READS
              value: "true"
            - name: API_ACTIVITY_LOG_EXCLUDED_PATHS
              value: /health,/metrics
            - name: LOG_FORMAT
              value: json
          ports:
            - name: http
              containerPort: 3001
              hostPort: 3101
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: hris-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: hris-api
spec:
  selector:
    app.kubernetes.io/name: hris-api
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hris-app
  labels:
    app.kubernetes.io/name: hris-app
    app.kubernetes.io/part-of: project-truth
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hris-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-app
        app.kubernetes.io/part-of: project-truth
    spec:
      containers:
        - name: app
          image: hris-app-local:develop
          imagePullPolicy: Never
          env:
            - name: APP_ENV
              value: dev
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: 0.0.0.0
            - name: HRIS_API_ORIGIN
              value: http://hris-api:3001
          ports:
            - name: http
              containerPort: 3000
              hostPort: 3100
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: hris-app
spec:
  selector:
    app.kubernetes.io/name: hris-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
