apiVersion: v1
kind: Secret
metadata:
  name: bnpi-pats-postgres-env
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: bnpi_pats
---
apiVersion: v1
kind: Secret
metadata:
  name: bnpi-pats-api-integration-env
type: Opaque
stringData:
  # GET /api/employee/search X-API-Key allowlist (one key per consuming team).
  # Rotation: append new key, give consumers time to switch, then remove old key.
  # See docs/INTEGRATION_EMPLOYEE_SEARCH_API.md. Fail-closed 503 when empty.
  INTEGRATION_API_KEYS: bnpi_pats_dev_db8c2a2d810b0757b991b1a5a741ef2f86633f319ceabdc9
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bnpi-pats-postgres-dev
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-dev
  hostPath:
    path: /var/lib/project-truth/k8s/dev/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bnpi-pats-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-dev
  resources:
    requests:
      storage: 20Gi
  volumeName: bnpi-pats-postgres-dev
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: bnpi-pats-uploads-dev
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-dev
  hostPath:
    path: /var/lib/project-truth/k8s/dev/uploads
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bnpi-pats-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-dev
  resources:
    requests:
      storage: 20Gi
  volumeName: bnpi-pats-uploads-dev
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bnpi-pats-postgres
  labels:
    app.kubernetes.io/name: bnpi-pats-postgres
    app.kubernetes.io/part-of: project-truth
spec:
  serviceName: bnpi-pats-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bnpi-pats-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnpi-pats-postgres
        app.kubernetes.io/part-of: project-truth
    spec:
      priorityClassName: project-truth-dev
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "200m"
              memory: 384Mi
            limits:
              cpu: "800m"
              memory: 1280Mi
          envFrom:
            - secretRef:
                name: bnpi-pats-postgres-env
          ports:
            - name: postgres
              containerPort: 5432
              hostPort: 15433
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: bnpi-pats-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: bnpi-pats-postgres
spec:
  selector:
    app.kubernetes.io/name: bnpi-pats-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: bnpi-pats-api-db-init
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnpi-pats-api-db-init
        app.kubernetes.io/part-of: project-truth
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: bnpi-pats-api-db-init:develop
          imagePullPolicy: Never
          # No prisma-seed on appliance DBs (seed can delete timesheet/attendance). Schema-only; prisma db push without --accept-data-loss is fail-closed on destructive drift.
          command:
            - sh
            - -c
            - npm run prisma-postgres:push
          env:
            - name: NODE_ENV
              value: development
            - name: APP_ENV
              value: dev
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnpi-pats-api
  labels:
    app.kubernetes.io/name: bnpi-pats-api
    app.kubernetes.io/part-of: project-truth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bnpi-pats-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bnpi-pats-api
        app.kubernetes.io/part-of: project-truth
    spec:
      priorityClassName: project-truth-dev
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: runtime-volume-permissions
          image: bnpi-pats-api-local:develop
          imagePullPolicy: Never
          command:
            - sh
            - -lc
            - mkdir -p /app/uploads/project-truth-runtime && chown -R 1001:1001 /app/uploads
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
      containers:
        - name: api
          image: bnpi-pats-api-local:develop
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "200m"
              memory: 384Mi
            limits:
              cpu: "1250m"
              memory: 1536Mi
          env:
            - name: NODE_ENV
              value: development
            - name: APP_ENV
              value: dev
            - name: NODE_OPTIONS
              value: --max-old-space-size=1152
            - name: JWT_SECRET
              value: project-truth-local-appliance-jwt-secret-change-me
            - name: PORT
              value: "3001"
            - name: STORAGE_PROVIDER
              value: local
            - name: LOCAL_UPLOAD_ROOT
              value: /app/uploads
            - name: PROJECT_TRUTH_RUNTIME_ROOT
              value: /app/uploads/project-truth-runtime
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats?connection_limit=30&pool_timeout=20
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats?connection_limit=30&pool_timeout=20
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@bnpi-pats-postgres:5432/bnpi_pats?connection_limit=30&pool_timeout=20
            - name: PRISMA_CONNECTION_LIMIT
              value: "30"
            - name: PRISMA_POOL_TIMEOUT_SECONDS
              value: "20"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: bnpi-pats-api-dev
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://10.184.37.19:4318/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=dev,service.namespace=bnpi-pats
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: API_ACTIVITY_LOGGING_ENABLED
              value: "true"
            - name: API_ACTIVITY_LOG_INCLUDE_READS
              value: "true"
            - name: API_ACTIVITY_LOG_EXCLUDED_PATHS
              value: /health,/metrics
            - name: LOG_FORMAT
              value: json
            - name: ALLOW_LAN_CORS
              value: "true"
            - name: CORS_CREDENTIALS
              value: "true"
            - name: CORS_ORIGINS
              value: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100,http://localhost:3200,http://127.0.0.1:3200,http://localhost:5175,http://127.0.0.1:5175,https://bnpi-pats.tech,https://www.bnpi-pats.tech,https://app.bnpi-pats.tech,https://dev.bnpi-pats.tech,https://uat.bnpi-pats.tech,http://bnpi-pats.lan,https://bnpi-pats.lan,http://www.bnpi-pats.lan,https://www.bnpi-pats.lan,http://app.bnpi-pats.lan,https://app.bnpi-pats.lan,http://api.bnpi-pats.lan,https://api.bnpi-pats.lan,http://dev.bnpi-pats.lan,https://dev.bnpi-pats.lan,http://dev-api.bnpi-pats.lan,https://dev-api.bnpi-pats.lan,http://uat.bnpi-pats.lan,https://uat.bnpi-pats.lan,http://uat-api.bnpi-pats.lan,https://uat-api.bnpi-pats.lan,http://grafana.bnpi-pats.lan,https://grafana.bnpi-pats.lan
            - name: NODE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: PROJECT_TRUTH_VM_HOST
              value: 10.184.37.19
            - name: PROJECT_TRUTH_VM_USER
              value: infra
            - name: PROJECT_TRUTH_VM_SSH_KEY
              value: /var/run/project-truth/ssh/node-health-appliance_ed25519
            - name: INTEGRATION_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: bnpi-pats-api-integration-env
                  key: INTEGRATION_API_KEYS
          ports:
            - name: http
              containerPort: 3001
              hostPort: 3101
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: dm-import-data
              mountPath: /data/import
              readOnly: true
            - name: dm-source-inputs
              mountPath: /source-inputs-organized
              readOnly: true
            - name: dm-docs
              mountPath: /docs
              readOnly: true
            - name: project-truth-ssh
              mountPath: /var/run/project-truth/ssh
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: bnpi-pats-uploads
        - name: dm-import-data
          hostPath:
            path: /var/lib/project-truth/dm-workflow/data/import
            type: DirectoryOrCreate
        - name: dm-source-inputs
          hostPath:
            path: /var/lib/project-truth/dm-workflow/source-inputs-organized
            type: DirectoryOrCreate
        - name: dm-docs
          hostPath:
            path: /var/lib/project-truth/dm-workflow/docs
            type: DirectoryOrCreate
        - name: project-truth-ssh
          hostPath:
            path: /var/lib/project-truth/ssh
            type: DirectoryOrCreate
