apiVersion: apps/v1
kind: Deployment
metadata:
  name: bnpi-pats-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            # Main Entrance A/B/D/E/F — serial card canaries (comma-separated).
            # Residual card gaps are E/F; keep D for historical single-id canary.
            # Not Main C / TEST. After reread-proven write, per-device
            # credentialCardWriter attestation also unlocks that target.
            - name: HIKVISION_AUTHORIZED_CARD_CANARY_DEVICE_ID
              value: cmpxw13hx002h7zwso7dyedrn,cmrht5s2w00ei7zgsre8y3o5n,cmripjwkw00ffl0013lfxcbxw,cmriu5ab102goi001x9o7nfct,cmrim1zop05ik7zp4zgm2sm4k
            # Main Entrance A–F — serial FDLib face canaries (comma-separated).
            # Include Main C once fleet FDLib capability matches proven peers
            # (same capabilityEvidenceSha256 / model). TEST A/B stay excluded.
            # After first reread-proven write, per-device fdlibPictureWriter
            # attestation also unlocks that target.
            - name: HIKVISION_AUTHORIZED_FACE_CANARY_DEVICE_ID
              value: cmpxw13hx002h7zwso7dyedrn,cmrht5s2w00ei7zgsre8y3o5n,cmripjwbx00ewl001ihcke210,cmripjwkw00ffl0013lfxcbxw,cmriu5ab102goi001x9o7nfct,cmrim1zop05ik7zp4zgm2sm4k
            - name: HIKVISION_FDLIB_FACE_DELIVERY_ORIGIN
              value: http://10.184.37.19:3101
