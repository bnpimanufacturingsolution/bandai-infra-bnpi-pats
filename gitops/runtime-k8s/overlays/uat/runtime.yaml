apiVersion: v1
kind: Secret
metadata:
  name: hris-postgres-env
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: hris
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hris-postgres-uat
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-uat
  hostPath:
    path: /var/lib/project-truth/k8s/uat/postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hris-postgres
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-uat
  resources:
    requests:
      storage: 20Gi
  volumeName: hris-postgres-uat
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hris-uploads-uat
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: project-truth-hostpath-uat
  hostPath:
    path: /var/lib/project-truth/k8s/uat/uploads
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hris-uploads
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: project-truth-hostpath-uat
  resources:
    requests:
      storage: 20Gi
  volumeName: hris-uploads-uat
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hris-postgres
  labels:
    app.kubernetes.io/name: hris-postgres
    app.kubernetes.io/part-of: project-truth
spec:
  serviceName: hris-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hris-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-postgres
        app.kubernetes.io/part-of: project-truth
    spec:
      priorityClassName: project-truth-uat
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "300m"
              memory: 512Mi
            limits:
              cpu: "1000m"
              memory: 1536Mi
          envFrom:
            - secretRef:
                name: hris-postgres-env
          ports:
            - name: postgres
              containerPort: 5432
              hostPort: 15434
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: hris-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: hris-postgres
spec:
  selector:
    app.kubernetes.io/name: hris-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hris-api-db-init
spec:
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-api-db-init
        app.kubernetes.io/part-of: project-truth
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: hris-api-db-init:develop
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - npm run prisma-postgres:push && npm run prisma-seed
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: uat
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hris-api
  labels:
    app.kubernetes.io/name: hris-api
    app.kubernetes.io/part-of: project-truth
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hris-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hris-api
        app.kubernetes.io/part-of: project-truth
    spec:
      priorityClassName: project-truth-uat
      containers:
        - name: api
          image: hris-api-local:develop
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "500m"
              memory: 1024Mi
            limits:
              cpu: "1500m"
              memory: 2048Mi
          env:
            - name: NODE_ENV
              value: production
            - name: APP_ENV
              value: uat
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
            - name: JWT_SECRET
              value: project-truth-local-appliance-jwt-secret-change-me
            - name: PORT
              value: "3001"
            - name: STORAGE_PROVIDER
              value: local
            - name: LOCAL_UPLOAD_ROOT
              value: /app/uploads
            - name: PG_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: WRITE_DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@hris-postgres:5432/hris
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: hris-api-uat
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://10.184.37.19:4318/v1/traces
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment=uat,service.namespace=hris
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "1.0"
            - name: API_ACTIVITY_LOGGING_ENABLED
              value: "true"
            - name: API_ACTIVITY_LOG_INCLUDE_READS
              value: "true"
            - name: API_ACTIVITY_LOG_EXCLUDED_PATHS
              value: /health,/metrics
            - name: LOG_FORMAT
              value: json
            - name: ALLOW_LAN_CORS
              value: "true"
            - name: CORS_CREDENTIALS
              value: "true"
            - name: CORS_ORIGINS
              value: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3100,http://127.0.0.1:3100,http://localhost:3200,http://127.0.0.1:3200,http://localhost:5175,http://127.0.0.1:5175,https://bnpi-hris.tech,https://www.bnpi-hris.tech,https://app.bnpi-hris.tech,https://dev.bnpi-hris.tech,https://uat.bnpi-hris.tech,https://emp.bnpi-hris.tech,https://dev-emp.bnpi-hris.tech,https://uat-emp.bnpi-hris.tech
            - name: NODE_HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: ZKTECO_BRIDGE_STATUS_URL
              value: http://$(NODE_HOST_IP):4371/status
            - name: ZKTECO_BRIDGE_PREVIEW_TIMEOUT_MS
              value: "180000"
            - name: ZKTECO_BRIDGE_SYNC_TIMEOUT_MS
              value: "90000"
            - name: PROJECT_TRUTH_VM_HOST
              value: 10.184.37.19
            - name: PROJECT_TRUTH_VM_USER
              value: infra
            - name: PROJECT_TRUTH_VM_SSH_KEY
              value: /var/run/project-truth/ssh/node-health-appliance_ed25519
            - name: PROJECT_TRUTH_HIKVISION_RUNTIME_LOCATION
              value: vm-container
            - name: PROJECT_TRUTH_HIKVISION_VM_API_BASE
              value: http://127.0.0.1:3201
          ports:
            - name: http
              containerPort: 3001
              hostPort: 3201
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: dm-import-data
              mountPath: /data/import
              readOnly: true
            - name: dm-source-inputs
              mountPath: /source-inputs-organized
              readOnly: true
            - name: dm-docs
              mountPath: /docs
              readOnly: true
            - name: project-truth-ssh
              mountPath: /var/run/project-truth/ssh
              readOnly: true
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: hris-uploads
        - name: dm-import-data
          hostPath:
            path: /var/lib/project-truth/dm-workflow/data/import
            type: DirectoryOrCreate
        - name: dm-source-inputs
          hostPath:
            path: /var/lib/project-truth/dm-workflow/source-inputs-organized
            type: DirectoryOrCreate
        - name: dm-docs
          hostPath:
            path: /var/lib/project-truth/dm-workflow/docs
            type: DirectoryOrCreate
        - name: project-truth-ssh
          hostPath:
            path: /var/lib/project-truth/ssh
            type: DirectoryOrCreate
---
