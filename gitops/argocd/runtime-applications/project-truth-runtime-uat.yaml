apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-truth-runtime-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bnpimanufacturingsolution/bandai-infra.git
    targetRevision: develop
    path: gitops/runtime-k8s/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
