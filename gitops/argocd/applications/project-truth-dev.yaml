apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-truth-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hrisworkforcesystem-coder/bandai-infra.git
    targetRevision: develop
    path: gitops/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
