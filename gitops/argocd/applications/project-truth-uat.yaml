apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-truth-uat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ernestdodz/INFRA.git
    targetRevision: terraform-hyperv-clean-plan
    path: gitops/overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: uat
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
