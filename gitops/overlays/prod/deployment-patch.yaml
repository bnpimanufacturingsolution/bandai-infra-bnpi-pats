apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-truth-health
spec:
  template:
    spec:
      containers:
        - name: project-truth-health
          image: project-truth-health:prod
          env:
            - name: ENVIRONMENT
              value: PROD
            - name: APP_VERSION
              value: prod
            - name: SERVICE_NAME
              value: project-truth
