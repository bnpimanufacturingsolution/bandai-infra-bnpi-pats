apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-truth-health
spec:
  template:
    spec:
      containers:
        - name: project-truth-health
          image: project-truth-health:dev
          env:
            - name: ENVIRONMENT
              value: DEV
            - name: APP_VERSION
              value: dev
            - name: SERVICE_NAME
              value: project-truth
